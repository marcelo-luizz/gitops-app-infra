# =============================================================================
# ApplicationSet: app-environments
# Gera 1 Application por TEAM por ENVIRONMENT
# Ex: payments-integration, payments-prod, notifications-integration, etc.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-environments
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: "https://github.com/jeitto/gitops-app-infra.git"
        revision: HEAD
        directories:
          - path: "environments/*"
  template:
    metadata:
      name: "app-{{index .path.segments 3}}-{{index .path.segments 1}}"
      namespace: argocd
      labels:
        repo: app-infra
        team: "{{index .path.segments 3}}"
        environment: "{{index .path.segments 1}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: "https://github.com/jeitto/gitops-app-infra.git"
        targetRevision: HEAD
        path: "{{.path.path}}"
        directory:
          recurse: true
          include: "*.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: crossplane-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
