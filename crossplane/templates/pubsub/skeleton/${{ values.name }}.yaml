apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: ${{ values.name }}-topic
  namespace: crossplane-system
spec:
  prodviderConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: ${{ values.name }}-subscription
  namespace: crossplane-system
spec:
  forProvider:
    topic: ${{ values.name }}-topic
    deadLetterPolicy:
      deadLetterTopic: ${{ values.name }}-dlq
      maxDeliveryAttempts: 5
---
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: ${{ values.name }}-dlq
  namespace: crossplane-system
spec:
  prodviderConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: ${{ values.name }}-dlq-subscription
  namespace: crossplane-system
spec:
  forProvider:
    topic: ${{ values.name }}-dlq