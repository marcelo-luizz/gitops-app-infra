apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: gcs-bucket
  title: Create GCS Bucket via Crossplane
  description: Gera um manifesto Crossplane e abre um PR no repositório de GitOps.
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Dados do Bucket
      required:
        - bucketname
        - environment
      properties:
        bucketname:
          title: Bucket Name
          type: string
          description: Nome único do bucket GCS.
        environment:
          title: Environment
          type: string
          enum:
            - dev
            - homolog
            - prod
          default: dev
        team:
          title: Team
          type: string
          enum: [team-a, team-b, team-c]

  steps:
    # 1. Busca o template que está na pasta crossplane/templates/gcs-bucket
    - id: fetch-template
      name: Fetch Crossplane Template
      action: fetch:template
      input:
        # Puxa do próprio repositório onde o template está registrado
        url: ./crossplane/templates/gcs-bucket 
        values:
          name: ${{ parameters.bucketname }}
          environment: ${{ parameters.environment }}
          team: ${{ parameters.team }}
        # O targetPath define onde os arquivos renderizados ficarão temporariamente no workspace do Backstage
        targetPath: ./infra

    # 2. Abre o Pull Request no repositório de infra
    - id: create-pr
      name: Create Pull Request
      action: publish:github:pull-request
      input:
        # Ajuste para a URL do seu repositório
        repoUrl: github.com?repo=gitops-app-infra&owner=marcelo-luizz
        branchName: create-bucket-${{ parameters.bucketname }}
        title: "feat(gcs): add bucket ${{ parameters.bucketname }} in ${{ parameters.environment }}"
        description: "Este PR foi gerado via Backstage para criar um novo bucket GCS usando Crossplane."
        # Aqui acontece a mágica: movemos o arquivo da pasta temporária para a pasta final do GitOps
        sourcePath: ./infra
        targetPath: environments/${{ parameters.environment }}/storage/gcs-bucket
        # Se quiser que o PR seja criado mesmo se a pasta não existir
        force: true

  output:
    links:
      - title: Acompanhar Pull Request
        url: ${{ steps['create-pr'].output.remoteUrl }}