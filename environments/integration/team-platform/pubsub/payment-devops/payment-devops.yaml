apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: payment-devops-topic
  namespace: crossplane-system
  annotations:
    team: group:default/guests
spec:
  forProvider: {}
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: payment-devops-subscription
  namespace: crossplane-system
  annotations:
    team: group:default/guests
spec:
  forProvider:
    topic: payment-devops-topic
    deadLetterPolicy:
      deadLetterTopicRef:
        name: payment-devops-dlq
      maxDeliveryAttempts: 5
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: payment-devops-dlq
  namespace: crossplane-system
  annotations:
    team: group:default/guests
spec:
  forProvider: {}
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: payment-devops-dlq-subscription
  namespace: crossplane-system
  annotations:
    team: group:default/guests
spec:
  forProvider:
    topic: payment-devops-dlq
  providerConfigRef:
    kind: ProviderConfig
    name: default