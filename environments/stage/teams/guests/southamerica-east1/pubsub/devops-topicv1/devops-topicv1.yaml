---
# Tópico Principal
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: devops-topicv1
  labels:
    team: guests
    env: stage
    resource-name: devops-topicv1
spec:
  forProvider: {}
  providerConfigRef:
    name: default
    kind: ProviderConfig

---
# Subscription Principal
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: devops-topicv1
spec:
  forProvider:
    topicSelector:
      matchLabels:
        resource-name: devops-topicv1
    ackDeadlineSeconds: 20
    
  providerConfigRef:
    name: default
    kind: ProviderConfig

