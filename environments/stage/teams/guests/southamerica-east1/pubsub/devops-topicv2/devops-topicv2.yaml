#     databaseVersion: MYSQL_5_7
#     deletionProtection: false
#     region: us-central1
#     settings:
#       diskSize: 20
#       tier: db-f1-micro
#   providerConfigRef:
#     name: default
#     kind: ProviderConfig
#   writeConnectionSecretToRef:
#     name: devops-topicv2-sql-db-instance-secret

---
# Tópico Principal
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: devops-topicv2
  labels:
    team: guests
    env: stage
    resource-name: devops-topicv2
spec:
  forProvider: {}
  providerConfigRef:
    name: default

---
# Subscription Principal
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: devops-topicv2
spec:
  forProvider:
    topicSelector:
      matchLabels:
        resource-name: devops-topicv2
    ackDeadlineSeconds: 20
    
    # Configuração da DLQ quando ativado
    deadLetterPolicy:
      - deadLetterTopicSelector:
          matchLabels:
            resource-name: devops-topicv2-dlq
        maxDeliveryAttempts: 5
    
  providerConfigRef:
    name: default


---
# Tópico de DLQ
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: devops-topicv2-dlq
  labels:
    resource-name: devops-topicv2-dlq
spec:
  forProvider: {}
  providerConfigRef:
    name: default

---
# Subscription de DLQ (Para drenar as mensagens presas)
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: devops-topicv2-dlq
spec:
  forProvider:
    topicSelector:
      matchLabels:
        resource-name: devops-topicv2-dlq
    ackDeadlineSeconds: 20
  providerConfigRef:
    name: default

---
# Permissão Necessária: PubSub Service Agent -> Publicar na DLQ
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: TopicIAMMember
metadata:
  name: "devops-topicv2-dlq-auth"
spec:
  forProvider:
    role: roles/pubsub.publisher
    # Service Agent padrão do PubSub (O número 509332012213 é o do seu projeto atual)
    member: "serviceAccount:service-509332012213@gcp-sa-pubsub.iam.gserviceaccount.com"
    topicSelector:
      matchLabels:
        resource-name: devops-topicv2-dlq
  providerConfigRef:
    name: default
