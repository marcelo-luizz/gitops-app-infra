# Tópico Principal
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: devops-topic-topic
  labels:
    team: guests
    env: stage
    resource-name: devops-topic
spec:
  forProvider: {}
  providerConfigRef:
    name: default

---
# Subscription Principal
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: devops-topic-subscription
  labels:
    team: guests
    env: stage
    resource-name: devops-topic-subscription
spec:
  forProvider:
    topicSelector:
      matchLabels:
        resource-name: devops-topic-topic
    ackDeadlineSeconds: 20
    
    deadLetterPolicy:
      - deadLetterTopicSelector:
          matchLabels:
            resource-name: devops-topic-dlq
        maxDeliveryAttempts: 5
    
  providerConfigRef:
    name: default


---
# Tópico de DLQ
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: devops-topic-dlq
  labels:
    team: guests
    env: stage
    resource-name: devops-topic-dlq
spec:
  forProvider: {}
  providerConfigRef:
    name: default

---
# Subscription de DLQ (Para drenar as mensagens presas)
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: devops-topic-dlq
  labels:
    team: guests
    env: stage
    resource-name: devops-topic-dlq-subscription
spec:
  forProvider:
    topicSelector:
      matchLabels:
        resource-name: devops-topic-dlq
    ackDeadlineSeconds: 20
  providerConfigRef:
    name: default

---
# Permissão Necessária: PubSub Service Agent -> Publicar na DLQ
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: TopicIAMMember
metadata:
  name: "devops-topic-dlq-auth"
spec:
  forProvider:
    role: roles/pubsub.publisher
    # Service Agent padrão do PubSub (O número 509332012213 é o do seu projeto atual)
    member: "serviceAccount:service-509332012213@gcp-sa-pubsub.iam.gserviceaccount.com"
    topicSelector:
      matchLabels:
        resource-name: devops-topic-dlq
  providerConfigRef:
    name: default
