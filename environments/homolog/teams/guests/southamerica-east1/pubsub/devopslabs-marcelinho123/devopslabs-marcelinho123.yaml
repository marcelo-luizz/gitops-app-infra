# Tópico Principal
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: devopslabs-marcelinho123-topic
  labels:
    team: guests
    env: homolog
    resource-name: devopslabs-marcelinho123-topic
spec:
  forProvider: {}
  providerConfigRef:
    name: default
    kind: ProviderConfig

---
# Subscription Principal
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: devopslabs-marcelinho123-subscription
  labels:
    team: guests
    env: homolog
    resource-name: devopslabs-marcelinho123-subscription
spec:
  forProvider:
    topicSelector:
      matchLabels:
        resource-name: devopslabs-marcelinho123-topic
    ackDeadlineSeconds: 30
    messageRetentionDuration: "172800s"
    expirationPolicy:
      ttl: "2678400s"
    
    deadLetterPolicy:
        deadLetterTopicSelector:
          matchLabels:
            resource-name: devopslabs-marcelinho123-dlq
        maxDeliveryAttempts: 5
    
  providerConfigRef:
    name: default
    kind: ProviderConfig


---
# Tópico de DLQ
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: devopslabs-marcelinho123-dlq
  labels:
    team: guests
    env: homolog
    resource-name: devopslabs-marcelinho123-dlq
spec:
  forProvider: {}
  providerConfigRef:
    name: default
    kind: ProviderConfig

---
# Subscription de DLQ (Para drenar as mensagens presas)
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: devopslabs-marcelinho123-dlq
  labels:
    team: guests
    env: homolog
    resource-name: devopslabs-marcelinho123-dlq-subscription
spec:
  forProvider:
    topicSelector:
      matchLabels:
        resource-name: devopslabs-marcelinho123-dlq
    ackDeadlineSeconds: 30
    messageRetentionDuration: "172800s"
    expirationPolicy:
      ttl: "2678400s"
  providerConfigRef:
    name: default
    kind: ProviderConfig

---
# Permissão Necessária: PubSub Service Agent -> Publicar na DLQ
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: TopicIAMMember
metadata:
  name: "devopslabs-marcelinho123-dlq-auth"
spec:
  forProvider:
    role: roles/pubsub.publisher
    member: "serviceAccount:service-509332012213@gcp-sa-pubsub.iam.gserviceaccount.com"
    topicSelector:
      matchLabels:
        resource-name: devopslabs-marcelinho123-dlq
  providerConfigRef:
    name: default
    kind: ProviderConfig
---
# Isso resolve o erro "Assign Subscriber role"
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: SubscriptionIAMMember
metadata:
  name: "devopslabs-marcelinho123-subscriber-auth"
spec:
  forProvider:
    role: roles/pubsub.subscriber
    member: "serviceAccount:service-509332012213@gcp-sa-pubsub.iam.gserviceaccount.com"
    subscriptionSelector:
      matchLabels:
        resource-name: devopslabs-marcelinho123-subscription
  providerConfigRef:
    name: default
    kind: ProviderConfig
