apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: payment-devops-topic
  namespace: crossplane-system
spec:
  prodviderConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: payment-devops-subscription
  namespace: crossplane-system
spec:
  forProvider:
    topic: payment-devops-topic
    deadLetterPolicy:
      deadLetterTopic: payment-devops-dlq
      maxDeliveryAttempts: 5
---
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: payment-devops-dlq
  namespace: crossplane-system
spec:
  prodviderConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: payment-devops-dlq-subscription
  namespace: crossplane-system
spec:
  forProvider:
    topic: payment-devops-dlq