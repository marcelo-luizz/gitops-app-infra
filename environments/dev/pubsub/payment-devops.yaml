apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: payment-devops-topic
  namespace: crossplane-system
spec:
  # CORRIGIDO: Removido o 'd' de prodvider
  providerConfigRef:
    name: default
---
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: payment-devops-subscription
  namespace: crossplane-system
spec:
  forProvider:
    # No Crossplane, é boa prática referenciar o tópico assim 
    # ou garantir que o nome bate exatamente com o metadata.name acima
    topic: payment-devops-topic
    deadLetterPolicy:
      deadLetterTopic: payment-devops-dlq
      maxDeliveryAttempts: 5
  providerConfigRef:
    name: default
---
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Topic
metadata:
  name: payment-devops-dlq
  namespace: crossplane-system
spec:
  # CORRIGIDO: providerConfigRef
  providerConfigRef:
    name: default
---
apiVersion: pubsub.gcp.m.upbound.io/v1beta1
kind: Subscription
metadata:
  name: payment-devops-dlq-subscription
  namespace: crossplane-system
spec:
  forProvider:
    topic: payment-devops-dlq
  providerConfigRef:
    name: default